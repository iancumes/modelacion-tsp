const $ = id => document.getElementById(id);
const nfmt = (n, digitos = 0) => n == null ? '—' : new Intl.NumberFormat('es-GT', {maximumFractionDigits: digitos, minimumFractionDigits: digitos}).format(n);
const nombres = {volcan72: 'Volcán 72', eil101: 'eil101', gr229: 'gr229'};
const colorGA = '#087e8b', colorLP = '#ab512d', tinta = '#172d42', gris = '#526779', grilla = '#dbe4eb';
let actual, corrida, cronometro;

function opcion(valor, etiqueta) { return new Option(etiqueta, valor); }
function nombreFila(f) { return f.metodo === 'LP' ? 'LP · óptimo certificado' : `GA · puesto ${f.puesto}`; }
function detener() { clearInterval(cronometro); cronometro = undefined; $('reproducir').textContent = 'Reproducir'; }
function ajustarCanvas(id) {
  const c = $(id), w = c.clientWidth, h = c.clientHeight, escala = window.devicePixelRatio || 1;
  if (!w || !h) return null;
  c.width = Math.round(w * escala); c.height = Math.round(h * escala);
  const ctx = c.getContext('2d'); ctx.scale(escala, escala);
  ctx.font = '12px system-ui, sans-serif';
  return {ctx, w, h};
}

function mapa(orden, color) {
  const lienzo = ajustarCanvas('mapa'); if (!lienzo) return;
  const {ctx, w, h} = lienzo, xy = actual.xy, geo = actual.metrica === 'GEO';
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const minimoX = Math.min(...xs), maximoX = Math.max(...xs), minimoY = Math.min(...ys), maximoY = Math.max(...ys);
  const escala = Math.min((w-52)/(maximoX-minimoX || 1), (h-54)/(maximoY-minimoY || 1));
  const proyectar = ([x,y]) => [w/2+(x-(maximoX+minimoX)/2)*escala, h/2-(y-(maximoY+minimoY)/2)*escala];
  ctx.strokeStyle = grilla; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < 8; i++) { ctx.moveTo(w*i/8, 8); ctx.lineTo(w*i/8,h-8); }
  for (let i = 1; i < 6; i++) { ctx.moveTo(8,h*i/6); ctx.lineTo(w-8,h*i/6); }
  ctx.stroke();
  if (orden) {
    const cerrada = [...orden, orden[0]];
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.65;
    cerrada.forEach((ciudad,i) => {
      const xyPantalla = proyectar(xy[ciudad]);
      if (!i || (geo && Math.abs(xy[ciudad][0]-xy[cerrada[i-1]][0]) > 180)) ctx.moveTo(...xyPantalla);
      else ctx.lineTo(...xyPantalla);
    });
    ctx.stroke();
  }
  xy.forEach((p,i) => {
    ctx.beginPath(); ctx.arc(...proyectar(p), i === orden?.[0] ? 4.8 : 2.35, 0, 2*Math.PI);
    ctx.fillStyle = i === orden?.[0] ? color : tinta; ctx.fill();
  });
  $('nota-mapa').textContent = geo ? 'Vista centrada en 130° E. La distancia se calcula con la métrica GEO de TSPLIB.' : 'Coordenadas del escenario. El punto de color marca el inicio y cierre del ciclo.';
}

function curva(historial, generacion) {
  const lienzo = ajustarCanvas('curva'); if (!lienzo) return;
  const {ctx, w, h} = lienzo, minimo = historial.at(-1).mejor, maximo = historial[0].mejor;
  const x = g => 48 + (w - 60) * g / (historial.length - 1);
  const y = d => 15 + (h - 53) * (maximo - d) / (maximo - minimo || 1);

  if (minimo !== maximo) ctx.fillText(nfmt(minimo), 0, h-33);

  ctx.strokeStyle = colorGA; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x(0),y(maximo));
  for (let i=1; i<historial.length; i++) { ctx.lineTo(x(i), y(historial[i-1].mejor)); ctx.lineTo(x(i), y(historial[i].mejor)); }
  ctx.stroke();
  ctx.fillStyle = colorLP; ctx.beginPath(); ctx.arc(x(generacion), y(historial[generacion].mejor), 4.5, 0, 2*Math.PI); ctx.fill();
}

function dibujar() {
  const animar = $('modo').value === 'ga';
  $('animacion').hidden = $('control-semilla').hidden = !animar;
  if (animar) {
    const gen = +$('generacion').value, h = corrida.historial[gen];
    const f = corrida.instantaneas.findLast(r => r.generacion <= gen);
    $('titulo-mapa').textContent = 'Mejor ruta acumulada';
    $('distancia').textContent = nfmt(f.D);
    $('contexto').textContent = `Diversidad de aristas ${nfmt(100*h.diversidad,1)}%.`;
    $('etiqueta-generacion').textContent = `Generación ${gen} de ${corrida.historial.length-1}`;
    $('generacion').setAttribute('aria-valuetext', $('etiqueta-generacion').textContent);
    $('anterior').disabled = gen === 0;
    $('siguiente').disabled = gen === corrida.historial.length - 1;
    mapa(f.ruta, colorGA); curva(corrida.historial, gen);
  } else {
    const f = actual.filas[+$('modo').value];
    $('titulo-mapa').textContent = nombreFila(f);
    $('distancia').textContent = nfmt(f.distancia);
    $('contexto').textContent = f.metodo === 'LP' ? actual.lp.estado : `Semilla ${f.semilla}${f.error_pct == null ? '' : ` · brecha ${nfmt(f.error_pct,3)}%`}`;
    mapa(f.ruta, f.metodo === 'LP' ? colorLP : colorGA);
  }
}

function seleccionarSemilla() {
  detener();
  corrida = actual.ga.find(r => r.semilla === +$('semilla').value);
  $('generacion').max = corrida ? corrida.historial.length - 1 : 0;
  $('generacion').value = 0;
  dibujar();
}

function seleccionarEscenario() {
  actual = datos[+$('escenario').value];
  $('modo').replaceChildren(...(actual.ga.length ? [opcion('ga','Evolución del GA')] : []), ...actual.filas.map((f,i) => opcion(i,nombreFila(f))));
  $('semilla').replaceChildren(...actual.ga.map(f => opcion(f.semilla, f.semilla)));
  if (actual.ga.length) $('semilla').value = actual.semilla_ilustrada;
  const ga = actual.config, lp = actual.lp;
  $('modelo').textContent = [`${actual.ids.length} ciudades`, ga && `GA: N = ${ga.poblacion}, ${ga.iteraciones} generaciones`, lp && `LP: ${nfmt(lp.variables)} variables, ${nfmt(lp.restricciones)} restricciones`].filter(Boolean).join(' · ');
  $('filas').replaceChildren(...actual.filas.map(f => {
    const fila = document.createElement('tr');
    for (const valor of [nombreFila(f),nfmt(f.semilla),nfmt(f.segundos,3),nfmt(f.optimo),nfmt(f.distancia),nfmt(f.error_pct,3)]) {
      const celda = fila.insertCell(); celda.textContent = valor;
    }
    return fila;
  }));
  seleccionarSemilla();
}

function cambiar(paso) {
  $('generacion').value = Math.max(0, Math.min(+$('generacion').max, +$('generacion').value + paso));
  dibujar();
}
$('escenario').replaceChildren(...datos.map((r,i) => opcion(i,nombres[r.nombre] ?? r.nombre)));
$('escenario').onchange = seleccionarEscenario;
$('semilla').onchange = seleccionarSemilla;
$('modo').onchange = () => { detener(); dibujar(); };
$('generacion').oninput = () => { detener(); dibujar(); };
$('anterior').onclick = () => { detener(); cambiar(-1); };
$('siguiente').onclick = () => { detener(); cambiar(1); };
$('reproducir').onclick = () => {
  if (cronometro) { detener(); return; }
  if ($('generacion').value === $('generacion').max) { $('generacion').value = 0; dibujar(); }
  $('reproducir').textContent = 'Pausar';
  cronometro = setInterval(() => {
    cambiar(Math.max(1, Math.round(+$('generacion').max / 85)));
    if ($('generacion').value === $('generacion').max) detener();
  }, 110);
};
window.addEventListener('resize', dibujar);
seleccionarEscenario();
</script>
